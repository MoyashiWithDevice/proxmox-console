version: "3.9"

services:
  kratos-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kratos
    volumes:
      - kratos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos"]
      interval: 5s
      timeout: 5s
      retries: 10

  kratos-migrate:
    image: oryd/kratos:latest
    command: migrate sql -e --yes -c /etc/config/kratos.yml
    volumes:
      - ./kratos/kratos.yaml:/etc/config/kratos.yml:ro
      - ./kratos/identity.schema.json:/etc/config/identity.schema.json:ro
    environment:
      DSN: postgres://kratos:secret@kratos-postgres:5432/kratos?sslmode=disable
    depends_on:
      kratos-postgres:
        condition: service_healthy
    restart: on-failure

  kratos:
    image: oryd/kratos:latest
    command: serve -c /etc/config/kratos.yml --dev
    ports:
      - "4433:4433"
      - "4434:4434"
    volumes:
      - ./kratos/kratos.yaml:/etc/config/kratos.yml:ro
      - ./kratos/identity.schema.json:/etc/config/identity.schema.json:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

  kratos-ui:
    image: oryd/kratos-selfservice-ui-node
    ports:
      - "3000:3000"
    env_file:
      - kratos/.env
    depends_on:
      kratos:
        condition: service_started

  app-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pg_user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
      - ./app-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg_user -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8080
      DB_HOST: app-postgres
      DB_PORT: 5433
      DB_USER: pg_user
      DB_PASSWORD: secret
      DB_NAME: app
      KRATOS_API_URL: http://kratos:4433
      KRATOS_UI_URL: http://localhost:3000
      APP_URL: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - app-cert:/app/cert
      - app-terraform-vms:/app/terraform/vms
    depends_on:
      app-postgres:
        condition: service_healthy
      kratos:
        condition: service_started
      kratos-ui:
        condition: service_started

volumes:
  kratos-postgres-data:
  app-postgres-data:
  app-cert:
  app-terraform-vms:
