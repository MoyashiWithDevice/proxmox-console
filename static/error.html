<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxmox Console — Error</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Inter',system-ui,sans-serif}
</style>
</head>
<body>
<div id="root"></div>
<script>
var iconPaths = {
  server: "M5 4H4a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h1m6 0h2a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2M5 14H4a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h1m6 0h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-2",
  logOut: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
  alertTriangle: "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01",
  arrowLeft: "M19 12H5M12 19l-7-7 7-7",
};

var h = React.createElement;

function Icon(props) {
  return h("svg", {
    width: props.size || 16, height: props.size || 16, viewBox: "0 0 24 24",
    fill: "none", stroke: props.color || "#fff", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round",
    style: Object.assign({ flexShrink: 0 }, props.style || {}),
  }, h("path", { d: iconPaths[props.name] }));
}

var errorMap = {
  400: { title: "Bad Request",          desc: "リクエストが正しくありません。" },
  401: { title: "Unauthorized",         desc: "認証が必要です。ログインしてください。" },
  403: { title: "Forbidden",            desc: "このリソースへのアクセスは許可されていません。" },
  404: { title: "Not Found",            desc: "お探しのページは存在しません。" },
  405: { title: "Method Not Allowed",   desc: "このメソッドは許可されていません。" },
  500: { title: "Internal Server Error", desc: "サーバー内部でエラーが発生しました。" },
  502: { title: "Bad Gateway",          desc: "ゲートウェイが不正な応答を返しました。" },
  503: { title: "Service Unavailable",  desc: "サービスは一時的に利用できません。" },
};

var params = new URLSearchParams(window.location.search);
var code = parseInt(params.get("code")) || 404;
var info = errorMap[code] || { title: "Error", desc: "不明なエラーが発生しました。" };

function App() {
  return h("div", { style: { display: "flex", flexDirection: "column", height: "100vh", background: "#000", color: "#fff", fontFamily: "'Inter', system-ui, sans-serif" } },

    h("div", { style: { display: "flex", alignItems: "center", padding: "0 32px", height: 52, borderBottom: "1px solid #111", flexShrink: 0 } },
      h("a", { href: "/", style: { display: "flex", alignItems: "center", gap: 10, textDecoration: "none" } },
        h("span", { style: { fontSize: 14, fontWeight: 600, color: "#fff", letterSpacing: "-0.01em" } }, "Proxmox Console"),
        h("span", { style: { fontSize: 11, color: "#333", marginLeft: 2 } }, "v1.0")
      ),
      h("button", {
        "aria-label": "Logout",
        onClick: function () { window.location.href = "/logout"; },
        style: { marginLeft: "auto", background: "none", border: "none", cursor: "pointer", padding: 0, display: "flex", alignItems: "center", gap: 6, color: "#444", fontSize: 12 }
      },
        h(Icon, { name: "logOut", size: 14, color: "#444" }), "Logout"
      )
    ),

    h("div", { style: { flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", padding: "0 64px" } },

      h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 24 } },
        h(Icon, { name: "alertTriangle", size: 20, color: "#f43f5e" }),
        h("span", { style: { fontSize: 11, color: "#f43f5e", fontFamily: "monospace", letterSpacing: "0.08em" } }, "HTTP " + code)
      ),

      h("div", { style: { fontSize: 48, fontWeight: 200, color: "#fff", letterSpacing: "-0.04em", lineHeight: 1.1, marginBottom: 16, textAlign: "center" } }, code),

      h("div", { style: { fontSize: 14, color: "#555", letterSpacing: "0.02em", marginBottom: 8, textAlign: "center" } }, info.title),

      h("div", { style: { fontSize: 13, color: "#444", lineHeight: 1.7, maxWidth: 380, textAlign: "center", marginBottom: 40 } }, info.desc),

      h("button", {
        onClick: function () { window.location.href = "/"; },
        style: {
          background: "#fff", color: "#000", border: "none",
          padding: "10px 24px", fontSize: 12, fontWeight: 600,
          cursor: "pointer", display: "flex", alignItems: "center", gap: 8,
          letterSpacing: "0.04em",
        }
      },
        h(Icon, { name: "arrowLeft", size: 13, color: "#000" }),
        "ダッシュボードに戻る"
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
