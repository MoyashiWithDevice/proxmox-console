<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>サポート</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #fff; font-family: 'Inter', system-ui, sans-serif; }
button { border: none; outline: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
var h = React.createElement;
var useState = React.useState;
var useEffect = React.useEffect;

var iconPaths = {
  logOut: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
  arrowLeft: "M19 12H5M12 5l-7 7 7 7",
};

function Icon(props) {
  return h("svg", {
    width: props.size || 16, height: props.size || 16, viewBox: "0 0 24 24",
    fill: "none", stroke: props.color || "#fff", strokeWidth: 2,
    strokeLinecap: "round", strokeLinejoin: "round",
    style: Object.assign({ flexShrink: 0 }, props.style || {}),
  }, h("path", { d: iconPaths[props.name] }));
}

function App() {
  var params = new URLSearchParams(location.search);
  var defaultVmid = params.get("vmid") || "";
  var _subject = useState(""); var subject = _subject[0]; var setSubject = _subject[1];
  var _vmid = useState(defaultVmid); var vmid = _vmid[0]; var setVmid = _vmid[1];
  var _details = useState(""); var details = _details[0]; var setDetails = _details[1];
  var _vms = useState([]); var vms = _vms[0]; var setVms = _vms[1];
  var _sending = useState(false); var sending = _sending[0]; var setSending = _sending[1];
  var _status = useState(null); var status = _status[0]; var setStatus = _status[1];
  var _message = useState(""); var message = _message[0]; var setMessage = _message[1];

  useEffect(function() {
    fetch('/api/vms', { credentials: 'include' })
      .then(function(resp) { return resp.json(); })
      .then(function(data) {
        if (!Array.isArray(data)) {
          return;
        }
        var vmItems = data.filter(function(item) { return item.type === 'vm'; });
        setVms(vmItems);
      })
      .catch(function() {
        setVms([]);
      });
  }, []);

  function inputStyle() {
    return {
      width: "100%",
      background: "#0d0d0d",
      border: "1px solid #222",
      color: "#fff",
      fontSize: 16,
      padding: "10px 12px",
      borderRadius: 8,
      outline: "none",
    };
  }

  function Field(label, node) {
    return h("div", { style: { marginBottom: 18 } },
      h("div", { style: { fontSize: 11, color: "#777", marginBottom: 8, letterSpacing: "0.08em", textTransform: "uppercase" } }, label),
      node
    );
  }

  function submit() {
    if (sending) return;
    setStatus(null);
    setMessage("");

    if (!subject.trim() || !details.trim()) {
      setStatus("error");
      setMessage("件名と詳細は必須です。");
      return;
    }

    setSending(true);
    fetch('/api/support', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subject: subject, vmid: vmid, details: details })
    }).then(function(resp) {
      if (!resp.ok) {
        return resp.text().then(function(text) { throw new Error(text || '送信に失敗しました'); });
      }
      return resp.json();
    }).then(function(data) {
      setStatus('success');
      setMessage(data.message || 'サポート依頼を送信しました。');
      setSubject('');
      setVmid('');
      setDetails('');
    }).catch(function(err) {
      setStatus('error');
      setMessage(err.message || '送信に失敗しました。');
    }).finally(function() {
      setSending(false);
    });
  }

  return h("div", { style: { minHeight: "100vh", background: "#000", display: "flex", flexDirection: "column" } },
    h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "20px 32px", borderBottom: "1px solid #111" } },
      h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
        h(Icon, { name: "logOut", size: 18, color: "#fff" }),
        h("div", { style: { fontSize: 16, fontWeight: 600 } }, "管理者へ連絡")
      ),
      h("button", {
        onClick: function() { window.location.href = '/'; },
        style: { background: "transparent", border: "1px solid #444", borderRadius: 8, color: "#fff", padding: "10px 14px", cursor: "pointer" }
      }, h(Icon, { name: "arrowLeft", size: 14, color: "#fff" }), " 戻る")
    ),
    h("div", { style: { flex: 1, display: "flex", justifyContent: "center", alignItems: "center", padding: 32 } },
      h("div", { style: { width: "100%", maxWidth: 640, background: "#111", border: "1px solid #1a1a1a", borderRadius: 16, padding: 28 } }, [
        Field("件名", h("input", { value: subject, onChange: function(e){ setSubject(e.target.value); }, style: inputStyle(), placeholder: "件名を入力してください" })),
        Field("VMID", h("select", {
          value: vmid,
          onChange: function(e) { setVmid(e.target.value); },
          style: inputStyle()
        }, [
          h("option", { value: "" }, "VM を選択しない"),
          vms.map(function(vm) {
            return h("option", { key: vm.VMID, value: vm.VMID }, vm.VMID + " — " + (vm.Name || "Unnamed"));
          })
        ])),
        Field("詳細", h("textarea", { value: details, onChange: function(e){ setDetails(e.target.value); }, style: Object.assign({}, inputStyle(), { minHeight: 160, resize: 'vertical' }), placeholder: "問題の内容や状況をできるだけ詳しくご記入ください。" })),
        h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" } }, [
          h("button", {
            onClick: submit,
            disabled: sending,
            style: { padding: "12px 20px", background: sending ? "#334155" : "#2563eb", color: "#fff", borderRadius: 10, cursor: sending ? "default" : "pointer" }
          }, sending ? "送信中…" : "送信"),
          status && h("div", { style: { color: status === 'success' ? '#22c55e' : '#f43f5e', fontSize: 14 } }, message)
        ])
      ])
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
