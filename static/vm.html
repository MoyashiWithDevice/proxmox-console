<body>

<script>

function Icon(props) {

    fill: "none", stroke: props.color || "#fff", strokeWidth: 2,
    strokeLinecap: "round", strokeLinejoin: "round",

}

var statusConfig = {
  done:    { dot: "#22c55e", color: "#22c55e" },
  running: { dot: "#22c55e", color: "#22c55e" },
  stopped: { dot: "#f43f5e", color: "#f43f5e" },
  error:   { dot: "#f43f5e", color: "#f43f5e" },
  "running(init)":    { dot: "#f59e0b", color: "#f59e0b" },
  "running(apply)":   { dot: "#f59e0b", color: "#f59e0b" },
  "running(modify)":  { dot: "#f59e0b", color: "#f59e0b" },
  "modified":         { dot: "#f59e0b", color: "#f59e0b" },
  unknown: { dot: "#555", color: "#555" },
};

function StatusBadge(props) {
  var cfg = statusConfig[props.status] || statusConfig.unknown;

  return h("span", {
    style: {
      display: "inline-flex",
      alignItems: "center",
      gap: 6,
      fontSize: 13,
      fontWeight: 500,
      color: cfg.color,
      padding: "4px 10px",
      borderRadius: 6,
      background:
        "rgba(" +
        parseInt(cfg.dot.slice(1,3), 16) + "," +
        parseInt(cfg.dot.slice(3,5), 16) + "," +
        parseInt(cfg.dot.slice(5,7), 16) +
        ",0.1)"
    }
  },
    h("span", {
      style: {
        width: 6,
        height: 6,
        borderRadius: "50%",
        background: cfg.dot
      }
    }),
    props.status
  );
}

function App() {
  var _v  = useState(null);  var vm       = _v[0];  var setVM      = _v[1];
  var _is = useState([]);    var items    = _is[0]; var setItems   = _is[1];
  var _h  = useState(null);  var hovered  = _h[0];  var setHovered = _h[1];
  var _s  = useState("—");  var status   = _s[0];  var setStatus  = _s[1];
  var _l  = useState("");   var log      = _l[0];  var setLog     = _l[1];
  var _j  = useState(null);  var jobVMID  = _j[0];  var setJobVMID = _j[1];
  var _r  = useState(10);   var redirectIn = _r[0]; var setRedirectIn = _r[1];

  var params = new URLSearchParams(location.search);
  var id = params.get("vmid");
  var jobId = params.get("job_id");

  useEffect(function() {
    if (id) {
      fetch("/api/vm?vmid=" + id, { credentials: "include" })
        .then(function(r) { return r.json(); })
        .then(function(data) { setVM(data); })
        .catch(function() { setVM(null); });
    } else {
      setVM(null);
    }

    function fetchItems() {
      fetch("/api/vms", { credentials: "include" })
        .then(function(r) { return r.json(); })
        .then(function(data) { setItems(data || []); })
        .catch(function() {});
    }

    function fetchStatus() {
      if (!jobId) {
        setStatus("—");
        setLog("");
        setJobVMID(null);
        return;
      }
      fetch("/api/vm?job_id=" + encodeURIComponent(jobId), { credentials: "include" })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          setStatus(data.status || "—");
          setLog(data.log || "");
          if (data.vmid) {
            setJobVMID(data.vmid);
            if (!id) {
              fetch("/api/vm?vmid=" + data.vmid, { credentials: "include" })
                .then(function(r) { return r.json(); })
                .then(function(vmData) { setVM(vmData); })
                .catch(function() { setVM(null); });
            }
          }
        })
        .catch(function() {});
    }

    fetchItems();
    fetchStatus();
    var iv = setInterval(function() {
      fetchItems();
      fetchStatus();
    }, 5000);
    return function() { clearInterval(iv); };
  }, [id, jobId]);

  useEffect(function() {
    if (!jobId || status !== "done" || !jobVMID) {
      if (redirectIn !== 10) {
        setRedirectIn(10);
      }
      return;
    }

    var counter = 10;
    setRedirectIn(counter);
    var iv2 = setInterval(function() {
      counter -= 1;
      if (counter <= 0) {
        clearInterval(iv2);
        window.location.href = "/vm.html?vmid=" + jobVMID;
      } else {
        setRedirectIn(counter);
      }
    }, 1000);

    return function() { clearInterval(iv2); };
  }, [jobId, status, jobVMID]);

  var vmItems = items;
  var isJob = Boolean(jobId);

  return h("div", { style: { display: "flex", flexDirection: "column", height: "100vh", background: "#000", color: "#fff" } },

    /* Header */
    h("div", { style: { display: "flex", alignItems: "center", padding: "0 32px", height: 52, borderBottom: "1px solid #111", flexShrink: 0, background: "#000" } },
      h("a", { href: "/", style: { display: "flex", alignItems: "center", gap: 10, textDecoration: "none" } },
        h("span", { style: { fontSize: 14, fontWeight: 600, color: "#fff", letterSpacing: "-0.01em" } }, "Proxmox Console"),
        h("span", { style: { fontSize: 11, color: "#333", marginLeft: 2 } }, "v1.0")
      ),
      h("div", { style: { marginLeft: "auto", display: "flex", alignItems: "center", gap: 10 } },
        h("button", {
          "aria-label": "Support",
          onClick: function() {
            var target = id || jobVMID ? "/support.html?vmid=" + encodeURIComponent(id || jobVMID) : "/support.html";
            window.location.href = target;
          },
          style: { background: "none", border: "1px solid #222", cursor: "pointer", padding: "8px 12px", borderRadius: 4, color: "#ddd", fontSize: 12, transition: "all 0.2s" }
        }, "サポート"),
        h("button", {
          "aria-label": "Logout",
          onClick: function() { window.location.href = "/logout"; },
          style: { background: "none", border: "none", cursor: "pointer", padding: 0, display: "flex", alignItems: "center", gap: 6, color: "#444", fontSize: 12, transition: "all 0.2s" }
        },
          h(Icon, { name: "logOut", size: 14, color: "#444" }), "Logout"
        )
      )
    ),

    /* Body */
    h("div", { style: { display: "flex", flex: 1, overflow: "hidden", background: "#000" } },

      /* Sidebar */
      h("div", {
        style: { width: 210, minWidth: 210, borderRight: "1px solid #111", overflowY: "auto", flexShrink: 0, paddingTop: 8, paddingBottom: 8, background: "#000" }
      },
        h("div", {
          onClick: function() { window.location.href = "/"; },
          style: { display: "flex", alignItems: "center", gap: 8, padding: "6px 16px 10px", cursor: "pointer", fontSize: 12, color: "#333", borderBottom: "1px solid #0d0d0d", marginBottom: 8, transition: "color 0.2s", fontWeight: 500 }
        },
          h(Icon, { name: "arrowLeft", size: 12, color: "#2a2a2a" }),
          "Dashboard"
        ),
        h("div", { style: { padding: "4px 18px 4px", fontSize: 10, color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 600 } }, "Virtual Machines"),
        vmItems.length === 0
          ? h("div", { style: { padding: "6px 16px", fontSize: 12, color: "#333" } }, "なし")
          : h("div", null,
              vmItems.filter(function(v) { return v.type !== "job"; }).map(function(v) {
                var isActive = String(v.VMID) === String(id);
                var isHover = hovered === "vm-" + v.VMID;
                var vmStatus = v.status || v.Status || "unknown";
                var statusStyle = statusConfig[vmStatus] || statusConfig.unknown;

                return h("div", {
                    key: v.VMID,
                    onClick: function() { window.location.href = "/vm.html?vmid=" + v.VMID; },
                    onMouseEnter: function() { setHovered("vm-" + v.VMID); },
                    onMouseLeave: function() { setHovered(null); },
                    style: {
                      display: "flex",
                      alignItems: "center",
                      gap: 8,
                      padding: "6px 16px",
                      cursor: "pointer",
                      fontSize: 13,
                      color: isActive ? "#fff" : isHover ? "#aaa" : "#555",
                      background: isActive ? "#111" : "transparent",
                      borderLeft: isActive ? "2px solid #fff" : "2px solid transparent",
                      userSelect: "none",
                      transition: "all 0.15s",
                      marginBottom: 2,
                      borderRadius: "0 6px 6px 0"
                    }
                  },
                  h("span", { style: { width: 8, height: 8, borderRadius: "50%", background: statusStyle.dot, flexShrink: 0, marginTop: 2 } }),
                  h(Icon, { name: "monitor", size: 13, color: isActive ? "#fff" : isHover ? "#555" : "#333" }),
                  h("span", { style: { overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, v.Name)
                );
              }),

              vmItems.some(function(v) { return v.type === "job"; }) 
                ? h("div", { style: { padding: "8px 18px 4px", fontSize: 10, color: "#2a2a2a", textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 600, marginTop: 14 } }, "作成中")
                : null,

              vmItems.filter(function(v) { return v.type === "job"; }).map(function(v) {
                var isActive = String(v.id) === String(id);
                var isHover = hovered === "job-" + v.id;

                return h("div", {
                    key: "job-" + v.id,
                    onClick: function() { window.location.href = "/vm.html?job_id=" + v.id; },
                    onMouseEnter: function() { setHovered("job-" + v.id); },
                    onMouseLeave: function() { setHovered(null); },
                    style: {
                      display: "flex",
                      alignItems: "center",
                      gap: 8,
                      padding: "6px 16px",
                      cursor: "pointer",
                      fontSize: 13,
                      color: isActive ? "#fff" : isHover ? "#aaa" : "#888",
                      background: isActive ? "#111" : "transparent",
                      borderLeft: isActive ? "2px solid #fff" : "2px solid transparent",
                      userSelect: "none",
                      transition: "all 0.15s",
                      marginBottom: 2,
                      borderRadius: "0 6px 6px 0"
                    }
                  },
                  h("span", { style: { width: 8, height: 8, borderRadius: "50%", background: (statusConfig[v.status] || statusConfig.unknown).dot, flexShrink: 0, marginTop: 2 } }),
                  h(Icon, { name: "monitor", size: 13, color: (statusConfig[v.status] || statusConfig.unknown).color }),
                  h("span", { style: { overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, v.servername + " (作成中)")
                );
              })
            )
      ),

      /* Main */
      h("div", { style: { flex: 1, overflowY: "auto", padding: "32px 40px", background: "#000" } },
        h("div", null,
          h("div", { style: { marginBottom: 32 } },
            h("h1", { style: { fontSize: 22, fontWeight: 300, letterSpacing: "-0.02em", marginBottom: 6, color: "#fff" } }, isJob ? "VM Creation" : "Virtual Machine"),
            h("p", { style: { fontSize: 12, color: "#333" } }, isJob ? "Track your VM creation progress" : "Manage and configure your virtual machine")
          ),

          isJob
            ? h(JobProgress, { jobVMID: jobVMID, status: status, log: log, redirectIn: redirectIn })
            : h("div", null,
                !id
                  ? h("div", { style: { color: "#666", fontSize: 13 } }, "Select a VM from the list to view details")
                  : vm === null
                    ? h("div", { style: { fontSize: 13, color: "#333" } }, "Loading...")
                    : h(VMEditor, { vm: vm, setVM: setVM })
              ),

          (id || jobVMID)
            ? h("div", { style: { marginTop: 40, paddingTop: 24, borderTop: "1px solid #111" } },
                h("p", { style: { fontSize: 12, color: "#555" } },
                  h("a", {
                    href: "/support.html?vmid=" + encodeURIComponent(id || jobVMID),
                    style: { color: "#666", textDecoration: "none", transition: "color 0.2s" }
                  }, "Need help? Contact support →")
                )
              )
            : null
        )
      )
    )
  );
}

function JobProgress(props) {
  return h("div", { style: { background: "#111", border: "1px solid #1a1a1a", borderRadius: 4, padding: 24 } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 20 } },
      h("span", { style: { fontSize: 10, color: "#666", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 600 } }, "Status"),
      h(StatusBadge, {status: props.status})
    ),
    h("div", { style: { background: "#0a0a0a", border: "1px solid #1a1a1a", borderRadius: 4, padding: 16, height: 300, whiteSpace: "pre-wrap", fontFamily: "Monaco, monospace", fontSize: 11, color: "#888", overflowX: "auto", overflowY: "auto", lineHeight: 1.5 } }, props.log),
    props.jobVMID && props.status === "done"
      ? h("div", { style: { marginTop: 20 } },
          h("div", { style: { color: "#aaa", fontSize: 12, marginBottom: 8 } }, "VM created successfully. Redirecting in " + props.redirectIn + " seconds..."),
          h("div", { style: { width: "100%", height: 2, background: "#1a1a1a", borderRadius: 1, overflow: "hidden" } },
            h("div", { style: { height: "100%", background: "#22c55e", width: (100 - (props.redirectIn / 10 * 100)) + "%", transition: "width 0.3s" } })
          )
        )
      : null
  );
}

function VMEditor(props) {
  var vm = props.vm;
  var setVM = props.setVM;

  var _n = useState("");    var name     = _n[0]; var setName     = _n[1];
  var _c = useState(0);     var cores    = _c[0]; var setCores    = _c[1];
  var _m = useState(0);     var memory   = _m[0]; var setMemory   = _m[1];
  var _h = useState(0);     var hdd      = _h[0]; var setHdd      = _h[1];
  var _e = useState(false);  var editing  = _e[0]; var setEditing  = _e[1];
  var _s = useState(false);  var saving   = _s[0]; var setSaving   = _s[1];
  var _j = useState(null);   var jobId    = _j[0]; var setJobId    = _j[1];
  var _js = useState("—");   var jobStatus = _js[0]; var setJobStatus = _js[1];
  var _d = useState(false);  var deleting = _d[0]; var setDeleting = _d[1];

  function resetFields() {
    setName(vm.Name || "");
    setCores(vm.Cores || 0);
    setMemory(vm.Memory || 0);
    setHdd(vm.Hdd || 0);
  }

  useEffect(function() {
    if (!vm || editing || saving || jobId) return;
    resetFields();
  }, [vm, editing, saving, jobId]);

  useEffect(function() {
    if (!jobId) return;

    function fetchJobStatus() {
      fetch("/api/vm?job_id=" + encodeURIComponent(jobId), { credentials: "include" })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          setJobStatus(data.status || "—");
          if (data.status === "done") {
            fetch("/api/vm?vmid=" + vm.VMID, { credentials: "include" })
              .then(function(r) { return r.json(); })
              .then(function(vmData) {
                setVM(vmData);
                setSaving(false);
                setEditing(false);
                setJobId(null);
                setJobStatus("—");
              })
              .catch(function() {
                setSaving(false);
                setJobId(null);
              });
          } else if (data.status === "error") {
            setSaving(false);
            setJobId(null);
            setJobStatus("—");
            alert("Failed to update VM");
          }
        })
        .catch(function() {});
    }

    fetchJobStatus();
    var iv = setInterval(fetchJobStatus, 2000);
    return function() { clearInterval(iv); };
  }, [jobId, vm.VMID]);

  function downloadPrivateKey() {
    if (!vm || !vm.VMID) {
      alert("VM ID not found");
      return;
    }

    fetch("/api/vm/key?vmid=" + vm.VMID, { credentials: "include" })
      .then(function(res) {
        if (!res.ok) {
          return res.text().then(function(text) {
            throw new Error(text || "Download failed");
          });
        }
        return res.blob();
      })
      .then(function(blob) {
        var url = window.URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "vm-" + vm.VMID + "-id_rsa";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
      })
      .catch(function(err) {
        alert("Failed to download key: " + err.message);
      });
  }

  function save() {
    var newHdd = parseInt(hdd, 10);

    if (newHdd < vm.Hdd) {
      alert("Cannot decrease disk size");
      return;
    }

    // TODO: 後で変更箇所のみを
    // パラメタに含めて送信するように変更する
    setSaving(true);
    fetch("/api/vm", {
      method: "PATCH",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        vmid: vm.VMID,
        name: name,
        cores: parseInt(cores, 10),
        memory: parseInt(memory, 10),
        hdd: newHdd
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.job_id) {
        setJobId(data.job_id);
        setJobStatus("running");
      } else {
        setSaving(false);
      }
    })
    .catch(function() {
      setSaving(false);
      alert("Failed to send request");
    });
  }

  function deleteVM() {
    if (!confirm("Are you sure? This action cannot be undone.")) return;
    
    setDeleting(true);
    fetch("/api/vm?vmid=" + vm.VMID, {
      method: "DELETE",
      credentials: "include",
    }).then(function(response) {
      if (response.ok) {
        window.location.href = "/";
        return;
      }
      return response.text().then(function(body) {
        setDeleting(false);
        alert("Deletion failed: " + body);
      });
    }).catch(function(err) {
      setDeleting(false);
      alert("Deletion failed: " + err.message);
    });
  }

  function inputStyle() {
    return {
      width: "100%",
      background: "#0a0a0a",
      border: "1px solid #1a1a1a",
      color: "#fff",
      fontSize: 14,
      padding: "10px 12px",
      borderRadius: 4,
      outline: "none",
      transition: "all 0.2s",
    };
  }

  function Field(label, node) {
    return h("div", { style: { marginBottom: 20 } },
      h("div", { style: { fontSize: 10, color: "#555", marginBottom: 6, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.08em" } }, label),
      node
    );
  }

  function viewValue(value) {
    return h("div", { style: { color: "#bbb", fontSize: 14, padding: "10px 12px", background: "#0a0a0a", borderRadius: 4, border: "1px solid #1a1a1a", fontWeight: 400 } }, value);
  }

  return h("div", { style: { maxWidth: 800 } }, [
    // Terminal + Primary Actions
    h("div", {
      key: "top-actions",
      style: {
        display: "flex",
        gap: 10,
        marginBottom: 28,
        alignItems: "center"
      }
    }, [
      h("button", {
        key: "terminal",
        onClick: function() {
          window.open("/terminal.html?vmid=" + vm.VMID, "_blank", "noopener,noreferrer");
        },
        style: {
          padding: "8px 16px",
          borderRadius: 4,
          border: "1px solid #2563eb",
          background: "rgba(37, 99, 235, 0.1)",
          color: "#60a5fa",
          cursor: "pointer",
          fontSize: 12,
          fontWeight: 500,
          transition: "all 0.2s",
          display: "inline-flex",
          alignItems: "center",
          gap: 6
        }
      }, h(Icon, { name: "terminal", size: 13, color: "#60a5fa" }), "Terminal"),

      !editing
        ? h("button", {
            type: "button",
            key:  "start-stop",
            onClick: function(e) {
              e.stopPropagation();
              var action = (vm && (vm.Status || vm.status) === "running") ? "stop" : "start";
              if (action === "stop" && !confirm("Stop this VM?")) return;
              fetch("/api/vm/state", {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                  vmid:  vm.VMID,
                  state: action
                })
              }).then(function(res){
                if (!res.ok) {
                  return res.text().then(function(t){ throw new Error("HTTP " + res.status + ": " + t); });
                }
                return res.text().then(function(text) {
                  if (!text) throw new Error("Empty response");
                  return JSON.parse(text);
                });
              }).then(function(){
                setVM(function(prev){
                  return {
                    ...prev,
                    status: action === "start"? "running": "stopped"
                  };
                });; 
              });
            },
            style: {
              padding: "8px 16px",
              borderRadius: 4,
              border: "1px solid #1a1a1a",
              background: "#111",
              color: "#fff",
              cursor: "pointer",
              fontSize: 12,
              fontWeight: 500,
              transition: "all 0.2s"
            }
          }, (vm && (vm.Status || vm.status) === "running") ? "Stop" : "Start")
        : null
    ]),

    // Details Card
    h("div", {
      key: "details-card",
      style: {
        background: "#111",
        border: "1px solid #1a1a1a",
        borderRadius: 4,
        padding: 24,
        marginBottom: 24
      }
    }, [
      // Header with VMID, IP, and Edit button
      h("div", { 
        key: "card-header",
        style: { 
          display: "flex", 
          justifyContent: "space-between", 
          alignItems: "flex-start", 
          marginBottom: 28,
          paddingBottom: 20,
          borderBottom: "1px solid #1a1a1a"
        } 
      },
        h("div", { style: { flex: 1 } },
          h("div", { style: { display: "flex", gap: 32, marginBottom: 0 } },
            h("div", null,
              h("div", { style: { fontSize: 10, color: "#555", marginBottom: 6, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.08em" } }, "VMID"),
              h("div", { style: { fontSize: 15, fontWeight: 500, color: "#fff", fontFamily: "Monaco, monospace" } }, vm.VMID)
            ),
            h("div", null,
              h("div", { style: { fontSize: 10, color: "#555", marginBottom: 6, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.08em" } }, "IP Address"),
              h("div", { style: { fontSize: 15, fontWeight: 500, color: "#fff", fontFamily: "Monaco, monospace" } }, vm.IP || "—")
            )
          )
        ),
        h("div", { style: { display: "flex", gap: 8 } },
          editing
            ? h("div", null,
                h("button", {
                  onClick: function() { resetFields(); setEditing(false); },
                  style: {
                    marginRight: 8,
                    padding: "8px 14px",
                    background: "transparent",
                    border: "1px solid #1a1a1a",
                    borderRadius: 4,
                    color: "#aaa",
                    cursor: "pointer",
                    fontSize: 12,
                    fontWeight: 500,
                    transition: "all 0.2s"
                  }
                }, "Cancel"),
                h("button", {
                  onClick: save,
                  disabled: saving,
                  style: {
                    padding: "8px 14px",
                    background: "#fff",
                    color: "#000",
                    border: "none",
                    borderRadius: 4,
                    cursor: saving ? "default" : "pointer",
                    fontSize: 12,
                    fontWeight: 600,
                    opacity: saving ? 0.7 : 1,
                    transition: "all 0.2s"
                  }
                }, saving ? "Saving..." : "Save")
              )
            : h("button", {
                onClick: function() { setEditing(true); },
                style: {
                  padding: "8px 14px",
                  background: "#fff",
                  color: "#000",
                  border: "none",
                  borderRadius: 4,
                  cursor: "pointer",
                  fontSize: 12,
                  fontWeight: 600,
                  transition: "all 0.2s"
                }
              }, "Edit")
        )
      ),

      // Fields grid
      h("div", { 
        key: "fields",
        style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 } 
      },
        Field("Name", editing
          ? h("input", { value: name, onChange: function(e){ setName(e.target.value); }, style: inputStyle() })
          : viewValue(vm.Name || "—")
        ),
        Field("CPU Cores", editing
          ? h("input", { type: "number", value: cores, onChange: function(e){ setCores(e.target.value); }, style: inputStyle() })
          : viewValue(vm.Cores)
        ),
        Field("Memory (MB)", editing
          ? h("input", { type: "number", value: memory, onChange: function(e){ setMemory(e.target.value); }, style: inputStyle() })
          : viewValue(vm.Memory)
        ),
        Field("Storage (GB)", editing
          ? h("input", { type: "number", value: hdd, onChange: function(e){ setHdd(e.target.value); }, style: inputStyle() })
          : viewValue(vm.Hdd)
        )
      ),

      // Download key (bottom of card, subtle)
      !editing
        ? h("div", {
            key: "download-key",
            style: {
              marginTop: 24,
              paddingTop: 20,
              borderTop: "1px solid #1a1a1a"
            }
          },
            h("button", {
              onClick: downloadPrivateKey,
              style: {
                padding: "8px 12px",
                background: "transparent",
                border: "1px solid #1a1a1a",
                borderRadius: 4,
                color: "#666",
                cursor: "pointer",
                fontSize: 12,
                fontWeight: 500,
                transition: "all 0.2s",
                display: "inline-flex",
                alignItems: "center",
                gap: 6
              }
            }, h(Icon, { name: "download", size: 12, color: "#666" }), "Download Private Key")
          )
        : null
    ]),

    // Danger Zone
    !editing
      ? h("div", {
          key: "danger-zone",
          style: {
            background: "rgba(244, 63, 94, 0.05)",
            border: "1px solid #f43f5e",
            borderRadius: 4,
            padding: 24
          }
        }, [
          h("h3", {
            key: "danger-title",
            style: {
              fontSize: 13,
              fontWeight: 600,
              color: "#f43f5e",
              marginBottom: 8
            }
          }, "Danger Zone"),
          h("p", {
            key: "danger-desc",
            style: {
              fontSize: 12,
              color: "#888",
              marginBottom: 16
            }
          }, "This action cannot be undone. The virtual machine will be permanently deleted."),
          h("button", {
            key: "delete-btn",
            onClick: deleteVM,
            disabled: deleting,
            style: {
              padding: "10px 16px",
              background: "#dc2626",
              border: "none",
              borderRadius: 4,
              color: "#fff",
              cursor: deleting ? "default" : "pointer",
              fontSize: 12,
              fontWeight: 600,
              opacity: deleting ? 0.7 : 1,
              transition: "all 0.2s",
              display: "inline-flex",
              alignItems: "center",
              gap: 6
            }
          }, h(Icon, { name: "trash", size: 13, color: "#fff" }), deleting ? "Deleting..." : "Delete VM")
        ])
      : null
  ]);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
