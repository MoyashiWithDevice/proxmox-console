          ? h("div", null,
              h("div", { style: { fontSize: 11, color: "#9ca3af", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" } }, "Status"),
              h("div", null, Badge(jobStatus))
            )
          : null
      ]),
      Field("Name", editing
        ? h("input", { value: name, onChange: function(e){ setName(e.target.value); }, style: inputStyle() })
        : viewValue(vm.Name || "—")
      ),
      Field("CPU", editing
        ? h("input", { type: "number", value: cores, onChange: function(e){ setCores(e.target.value); }, style: inputStyle() })
        : viewValue(vm.Cores)
      ),
      Field("Memory", editing
        ? h("input", { type: "number", value: memory, onChange: function(e){ setMemory(e.target.value); }, style: inputStyle() })
        : viewValue(vm.Memory)
      ),
      Field("HDD", editing
        ? h("input", { type: "number", value: hdd, onChange: function(e){ setHdd(e.target.value); }, style: inputStyle() })
        : viewValue(vm.Hdd)
      ),
      !editing
        ? h("button", {
            onClick: function() {
              if (!confirm("このVMを停止して削除してもよろしいですか？")) { return; }
              fetch("/api/vm?vmid=" + vm.VMID, {
                method: "DELETE",
                credentials: "include",
              }).then(function(response) {
                if (response.ok) {
                  window.location.href = "/";
                  return;
                }
                return response.text().then(function(body) {
                  alert("削除に失敗しました: " + body);
                });
              }).catch(function() {
                alert("削除に失敗しました");
              });
            },
            style: { marginTop: 12, width: "100%", padding: "12px 14px", background: "#dc2626", border: "none", borderRadius: 8, color: "#fff", fontSize: 14, cursor: "pointer" }
          }, "このVMを削除する")
        : null
    ])
  ]);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
