<!DOCTYPE html><html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Proxmox Console</title>
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div id="root" style="display:flex;height:100vh;width:100vw;overflow:hidden;background:#04040a;position:relative">
<div class="scanlines"></div><div class="vignette"></div>
<div class="dot-bg" style="position:fixed;inset:0;z-index:-1;opacity:0.5"></div>
<svg style="position:fixed;width:0;height:0"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg>
<div style="width:50%;min-width:500px;background:linear-gradient(170deg,#0a0a12 0%,#04040a 100%);display:flex;flex-direction:column;padding:48px;position:relative;overflow:hidden" class="fu1">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:40px;z-index:2">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4H4a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h1m6 0h2a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2M5 14H4a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h1m6 0h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-2"/></svg>
<span style="font-size:18px;font-weight:600;color:#fff;letter-spacing:-0.02em">Proxmox Console</span>
</div>
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;z-index:2;max-width:460px">
<h2 style="font-size:34px;font-weight:300;letter-spacing:-0.04em;line-height:1.2;margin-bottom:20px">Server<br><span style="font-weight:600">infrastructure.</span><br><span style="color:rgba(255,255,255,0.5);font-weight:300">Simplified.</span></h2>
<p style="font-size:14px;color:rgba(255,255,255,0.3);line-height:1.7;margin-bottom:32px">Deploy, manage, and monitor your virtual machines with our Proxmox-based platform. Built for speed, simplicity, and reliability.</p>
<div style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2-9 5 9 5 9-5-9-5Z"/><path d="M3 12.6 12 17.6 21 12.6"/><path d="M3 17.6 12 22.6 21 17.6"/></svg><span style="font-size:13px;color:rgba(255,255,255,0.3)">One-click OS deployments</span></div>
<div style="display:flex;align-items:center;gap:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5l6.74-6.76Z"/><path d="M16 8 7 17"/><path d="M12 12 9 15"/></svg><span style="font-size:13px;color:rgba(255,255,255,0.3)">Instant terminal access</span></div>
<div style="display:flex;align-items:center;gap:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span style="font-size:13px;color:rgba(255,255,255,0.3)">Real-time resource monitoring</span></div>
</div>
</div>
<div style="position:absolute;bottom:0;left:0;width:100%;height:35%;background:linear-gradient(0deg,rgba(255,255,255,0.013) 0%,transparent 100%);pointer-events:none;z-index:1"></div>
<div style="position:absolute;top:15%;right:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,0.07) 0%,transparent 70%);filter:blur(50px);pointer-events:none;z-index:0"></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;position:relative;overflow-y:auto;overflow-x:hidden" class="fu2">
<div id="right-panel" style="width:100%;max-width:400px;position:relative;z-index:2"></div>
</div>
</div>
<script>var FLOW = {{.FlowJSON}};var IS_REG = {{.IsRegistration}};var PAGE_TITLE = "{{.Title}}";</script>
<script src="/js/auth.js"></script>
</body>
</html>
