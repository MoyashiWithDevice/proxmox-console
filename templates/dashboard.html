{{define "title"}}Proxmox Console{{end}}
{{define "styles"}}<link rel="stylesheet" href="/css/dashboard.css">{{end}}
{{define "content"}}
<div style="display:flex;flex-direction:column;height:100vh;min-height:600px">
  {{template "page-header" .}}
  <div style="display:flex;flex:1;overflow:hidden">
    {{template "sidebar" .}}
    <div style="flex:1;overflow-y:auto;padding:32px 40px;display:flex;flex-direction:column;gap:32px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
            <span style="font-size:22px;font-weight:300;color:#fff;letter-spacing:-0.02em">Dashboard</span>
            <span id="dash-badge" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#22c55e"></span>
          </div>
          <div style="font-size:12px;color:#333">Proxmox VE · Virtual Environment</div>
        </div>
        <button onclick="window.location.href='/resource'" style="background:#fff;color:#000;border:none;border-radius:4px;padding:8px 18px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px">{{template "icon-plus" .}} VM作成</button>
      </div>
      <div id="stat-cards" style="display:flex;gap:0;border:1px solid #111;flex-wrap:wrap"></div>
      <div style="display:flex;gap:32px;flex-wrap:wrap" id="dash-meta"></div>
      <div style="border-top:1px solid #111"></div>
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <span style="font-size:13px;color:#555">作成済み / 作成中マシン一覧</span>
          <button onclick="fetchVMs()" style="background:transparent;border:1px solid #111;border-radius:4px;padding:5px 12px;color:#444;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px">{{template "icon-refresh" .}} Refresh</button>
        </div>
        <table class="vm-table">
          <thead>
            <tr>
              <th style="padding:10px 16px;font-size:11px;color:#333;font-weight:500;text-align:left;border-bottom:1px solid #111;text-transform:uppercase;letter-spacing:0.07em;white-space:nowrap">VMID</th>
              <th style="padding:10px 16px;font-size:11px;color:#333;font-weight:500;text-align:left;border-bottom:1px solid #111;text-transform:uppercase;letter-spacing:0.07em;white-space:nowrap">名前</th>
              <th style="padding:10px 16px;font-size:11px;color:#333;font-weight:500;text-align:left;border-bottom:1px solid #111;text-transform:uppercase;letter-spacing:0.07em;white-space:nowrap">IP</th>
              <th style="padding:10px 16px;font-size:11px;color:#333;font-weight:500;text-align:left;border-bottom:1px solid #111;text-transform:uppercase;letter-spacing:0.07em;white-space:nowrap">CPU</th>
              <th style="padding:10px 16px;font-size:11px;color:#333;font-weight:500;text-align:left;border-bottom:1px solid #111;text-transform:uppercase;letter-spacing:0.07em;white-space:nowrap">Memory</th>
              <th style="padding:10px 16px;font-size:11px;color:#333;font-weight:500;text-align:left;border-bottom:1px solid #111;text-transform:uppercase;letter-spacing:0.07em;white-space:nowrap">Action</th>
            </tr>
          </thead>
          <tbody id="vm-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{{end}}
{{define "scripts"}}
<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
{{end}}
{{template "base" .}}
