{{define "title"}}Proxmox Console - Resource Selection{{end}}
{{define "styles"}}<link rel="stylesheet" href="/css/resource.css">{{end}}
{{define "content"}}
<div style="display:flex;flex-direction:column;height:100vh;min-height:600px">
  {{template "page-header" .}}
  <div style="flex:1;overflow-y:auto;padding:32px 40px;display:flex;flex-direction:column;gap:0">
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#333;margin-bottom:24px">
      <a href="/" style="color:#444;text-decoration:none">Dashboard</a>
      <span>/</span>
      <span style="color:#fff">リソース選択</span>
    </div>
    <div style="font-size:22px;font-weight:300;color:#fff;letter-spacing:-0.02em;margin-bottom:28px">仮想マシン リソース選択</div>
    <form method="get" action="/info" style="display:flex;flex-direction:column;gap:0">
      <input type="hidden" name="cpu" value="1" id="res-cpu-hidden">
      <input type="hidden" name="memory" value="1024" id="res-mem-hidden">
      <input type="hidden" name="hdd" value="10" id="res-hdd-hidden">
      <div id="resource-area"></div>
      <div style="padding:18px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
        <div id="res-summary" style="display:flex;gap:28">
          <div><div style="font-size:11px;color:#333;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.07em">CPU</div><div id="res-cpu-label" style="font-size:14px;color:#888">1 コア</div></div>
          <div><div style="font-size:11px;color:#333;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.07em">メモリ</div><div id="res-mem-label" style="font-size:14px;color:#888">1024 MB</div></div>
          <div><div style="font-size:11px;color:#333;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.07em">ディスク</div><div id="res-hdd-label" style="font-size:14px;color:#888">10 GB</div></div>
        </div>
        <button type="submit" style="background:#fff;color:#000;border:none;border-radius:4px;padding:10px 28px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px">{{template "icon-arrowRight" .}} 次へ進む</button>
      </div>
    </form>
  </div>
</div>
{{end}}
{{define "scripts"}}
<script src="/js/common.js"></script>
<script src="/js/resource.js"></script>
{{end}}
{{template "base" .}}
