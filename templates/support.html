{{define "title"}}Proxmox Console - サポート{{end}}
{{define "styles"}}<link rel="stylesheet" href="/css/support.css">{{end}}
{{define "content"}}
<div id="root" style="min-height:100vh;background:#000;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid #111">
    <div style="display:flex;align-items:center;gap:10px">
      {{template "icon-logOut" .}}
      <div style="font-size:16px;font-weight:600">管理者へ連絡</div>
    </div>
    <button onclick="window.location.href='/'" style="background:transparent;border:1px solid #444;border-radius:8;color:#fff;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:6px">
      {{template "icon-arrowLeft" .}} 戻る
    </button>
  </div>
  <div style="flex:1;display:flex;justify-content:center;align-items:center;padding:32px">
    <div style="width:100%;max-width:640px;background:#111;border:1px solid #1a1a1a;border-radius:16px;padding:28px">
      <div class="field-subject" style="margin-bottom:18px">
        <div style="font-size:11px;color:#777;margin-bottom:8px;letter-spacing:0.08em;text-transform:uppercase">件名</div>
        <input id="support-subject" type="text" placeholder="件名を入力してください" style="width:100%;background:#0d0d0d;border:1px solid #222;color:#fff;font-size:16px;padding:10px 12px;border-radius:8px;outline:none">
      </div>
      <div class="field-vmid" style="margin-bottom:18px">
        <div style="font-size:11px;color:#777;margin-bottom:8px;letter-spacing:0.08em;text-transform:uppercase">VMID</div>
        <select id="support-vmid" style="width:100%;background:#0d0d0d;border:1px solid #222;color:#fff;font-size:16px;padding:10px 12px;border-radius:8px;outline:none">
          <option value="">VM を選択しない</option>
        </select>
      </div>
      <div class="field-details" style="margin-bottom:18px">
        <div style="font-size:11px;color:#777;margin-bottom:8px;letter-spacing:0.08em;text-transform:uppercase">詳細</div>
        <textarea id="support-details" placeholder="問題の内容や状況をできるだけ詳しくご記入ください。" style="width:100%;background:#0d0d0d;border:1px solid #222;color:#fff;font-size:16px;padding:10px 12px;border-radius:8px;outline:none;min-height:160px;resize:vertical"></textarea>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <button id="support-submit" style="padding:12px 20px;background:#2563eb;color:#fff;border-radius:10px;cursor:pointer;font-size:14px;border:none">送信</button>
        <div id="support-status" style="display:none;font-size:14px"></div>
      </div>
    </div>
  </div>
</div>
{{end}}
{{define "scripts"}}
<script src="/js/common.js"></script>
<script src="/js/support.js"></script>
{{end}}
{{template "base" .}}
