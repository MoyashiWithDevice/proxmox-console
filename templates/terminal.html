{{define "title"}}Proxmox Console - Terminal{{end}}
{{define "styles"}}<link rel="stylesheet" href="/css/terminal.css">{{end}}
{{define "content"}}
<div style="display:flex;flex-direction:column;height:100vh;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:44px;background:#0d0d0d;border-bottom:1px solid #1a1a1a;flex-shrink:0">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:13px;font-weight:500;color:#aaa">Terminal</span>
      <span style="font-size:11px;color:#444">{{.VMID}}</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button onclick="window.location.href='/vm?vmid={{.VMID}}'" style="background:none;border:1px solid #222;color:#888;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px">戻る</button>
      <button onclick="window.location.href='/logout'" style="background:none;border:none;color:#444;padding:4px 10px;cursor:pointer;font-size:11px">Logout</button>
    </div>
  </div>
  <div id="terminal-container" style="flex:1;padding:8px;background:#000"></div>
</div>
{{end}}
{{define "scripts"}}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js" crossorigin></script>
<script src="/js/terminal.js"></script>
{{end}}
{{template "base" .}}
