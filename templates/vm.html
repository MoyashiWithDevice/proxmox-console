{{define "title"}}Proxmox Console - VM Detail{{end}}
{{define "styles"}}<link rel="stylesheet" href="/css/vm.css">{{end}}
{{define "content"}}
<div id="root" style="display:flex;flex-direction:column;height:100vh;background:#000;color:#fff">
  <div style="display:flex;align-items:center;padding:0 32px;height:52px;border-bottom:1px solid #111;flex-shrink:0;background:#000">
    <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none">
      <span style="font-size:14px;font-weight:600;color:#fff;letter-spacing:-0.01em">Proxmox Console</span>
      <span style="font-size:11px;color:#333;margin-left:2px">v1.0</span>
    </a>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
      <button id="btn-support" aria-label="Support" style="background:none;border:1px solid #222;cursor:pointer;padding:8px 12px;border-radius:8px;color:#ddd;font-size:12px">サポート</button>
      <button aria-label="Logout" onclick="window.location.href='/logout'" style="background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;gap:6px;color:#444;font-size:12px">{{template "icon-logOut" .}} Logout</button>
    </div>
  </div>
  <div style="display:flex;flex:1;overflow:hidden">
    {{template "sidebar" .}}
    <div style="flex:1;overflow-y:auto;padding:32px 40px;background:#000">
      <div id="main-content">
        <div style="margin-bottom:32px">
          <h1 id="page-title" style="font-size:22px;font-weight:300;letter-spacing:-0.02em;margin-bottom:6px;color:#fff">Virtual Machine</h1>
          <p id="page-desc" style="font-size:12px;color:#333">Manage and configure your virtual machine</p>
        </div>
        <div id="content-area"></div>
        <div id="support-link" style="display:none;margin-top:40px;padding-top:24px;border-top:1px solid #111">
          <p style="font-size:12px;color:#555"><a id="support-link-a" style="color:#666;text-decoration:none;transition:color 0.2s">Need help? Contact support →</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{{end}}
{{define "scripts"}}
<script src="/js/common.js"></script>
<script src="/js/vm.js"></script>
{{end}}
{{template "base" .}}
