#cloud-config
hostname: ${servername}
ssh_pwauth: false

write_files:
  - path: /etc/machine-id
    content: ""
    permissions: '0444'

bootcmd:
  - cloud-init clean --logs --seed
  - systemd-machine-id-setup --random
  - ln -sf /etc/machine-id /var/lib/dbus/machine-id

users:
  - name: ${username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${user_pubkey}

  - name: ${agent_user}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${agent_pubkey}

chpasswd:
  expire: false

runcmd:
%{ if runcmd != "" ~}
%{ for cmd in split("\n", runcmd) ~}
  - ${cmd}
%{ endfor ~}
%{ endif ~}
